<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review queue</title>
<style>
  :root { --bg:#f6f5f1; --panel:#fff; --ink:#1d1d1b; --muted:#6b6a64; --line:#e3e1da;
          --ok:#1d7a4d; --warn:#b4530f; --chip:#f0efe9; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:18px; padding:12px 22px; background:var(--panel);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
  h1 { font-size:16px; margin:0; font-weight:650; }
  .stats { margin-left:auto; display:flex; gap:18px; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .stats b { color:var(--ink); }
  main { max-width:900px; margin:0 auto; padding:20px 22px 60px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .chip { background:var(--chip); border-radius:99px; padding:2px 10px; font-size:12.5px; color:var(--muted); }
  .chip.esc { background:#fdece0; color:var(--warn); font-weight:600; }
  .chip.auto { background:#e7f5ec; color:var(--ok); font-weight:600; }
  .tweet { font-size:16px; padding:10px 14px; border-left:3px solid var(--ink); background:#fbfbf8; border-radius:0 8px 8px 0; }
  .turn { font-size:13.5px; color:var(--muted); padding:6px 12px; background:var(--chip); border-radius:8px; margin-bottom:5px; }
  .why { font-size:13.5px; color:var(--muted); margin:10px 0 0; }
  textarea { width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 12px;
             font:inherit; font-size:15px; min-height:74px; margin-top:12px; resize:vertical; }
  .evidence { margin-top:12px; }
  .evidence summary { cursor:pointer; color:var(--muted); font-size:13px; }
  .evidence li { font-size:13.5px; color:#3b3a36; margin:6px 0; }
  .actions { display:flex; gap:8px; margin-top:14px; align-items:center; flex-wrap:wrap; }
  button { border:1px solid var(--line); background:var(--panel); border-radius:9px;
           padding:8px 14px; font:inherit; cursor:pointer; }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  .note { color:var(--muted); font-size:13px; margin-left:auto; }
  .empty { text-align:center; color:var(--muted); padding:50px 0; }
  kbd { font:12px ui-monospace,monospace; background:var(--chip); border-radius:5px; padding:1px 6px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Review queue</h1>
  <span class="chip" id="queue-count">&ndash;</span>
  <div class="stats" id="stats"></div>
</header>
<main id="app"><div class="empty">Loading&hellip;</div></main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let queue = [], idx = 0;

async function load() {
  const state = await (await fetch('/review/state')).json();
  queue = state.queue;
  render(state.report);
}

function render(report) {
  document.getElementById('queue-count').textContent = queue.length + ' waiting';
  if (report) {
    const rate = report.accept_rate === null ? '-' : Math.round(report.accept_rate * 100) + '%';
    const edited = (report.most_edited_intents[0] || ['-'])[0];
    document.getElementById('stats').innerHTML =
      '<span>reviewed <b>' + report.reviewed + '</b></span>' +
      '<span>accept rate <b>' + rate + '</b></span>' +
      '<span>most edited <b>' + esc(edited) + '</b></span>';
  }
  const app = document.getElementById('app');
  if (!queue.length) {
    app.innerHTML = '<div class="card empty">Nothing waiting. Drafts appear here as <code>/triage</code> routes them.</div>';
    return;
  }
  const item = queue[Math.min(idx, queue.length - 1)];
  const turns = (item.context || []).map(t =>
    '<div class="turn"><b>' + (t.role === 'customer' ? 'Customer' : 'Agent') + ':</b> ' + esc(t.text) + '</div>').join('');
  const evidence = (item.evidence || []).map(e =>
    '<li><b>' + esc(e.text) + '</b><br>&rarr; ' + esc(e.brand_reply) + '</li>').join('') || '<li>none recorded</li>';
  app.innerHTML =
    '<section class="card">' +
      '<div class="row">' +
        '<span class="chip ' + (item.escalate ? 'esc' : 'auto') + '">' +
          (item.escalate ? 'escalate &middot; ' + esc(item.escalation_reason) : 'auto-handled') + '</span>' +
        '<span class="chip">' + esc(item.intent) + '</span>' +
        '<span class="chip">confidence ' + Math.round((item.confidence || 0) * 100) + '%</span>' +
        (item.guardrail ? '<span class="chip esc">guardrail: ' + esc(item.guardrail) + '</span>' : '') +
        (item.pii_detected ? '<span class="chip esc">PII redacted: ' + esc(item.pii_detected.join(', ')) + '</span>' : '') +
      '</div>' + turns +
      '<div class="tweet">' + esc(item.text) + '</div>' +
      '<p class="why">' + esc(item.reason) + '</p>' +
      '<details class="evidence"><summary>Evidence &mdash; past cases this draft was built from</summary><ul>' + evidence + '</ul></details>' +
      '<textarea id="reply">' + esc(item.reply) + '</textarea>' +
      '<div class="actions">' +
        '<button class="primary" onclick="send(\'accepted\')">Accept <kbd>a</kbd></button>' +
        '<button onclick="send(\'edited\')">Send edited <kbd>e</kbd></button>' +
        '<button onclick="send(\'rejected\')">Reject <kbd>r</kbd></button>' +
        '<button onclick="skip()">Skip</button>' +
        '<span class="note" id="note">request ' + esc(item.request_id) + '</span>' +
      '</div>' +
    '</section>';
}

async function send(action) {
  const item = queue[Math.min(idx, queue.length - 1)];
  const final_reply = document.getElementById('reply').value;
  if (action === 'edited' && final_reply.trim() === (item.reply || '').trim()) {
    document.getElementById('note').textContent = 'Edit the draft first, or press Accept';
    return;
  }
  await fetch('/feedback', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({request_id: item.request_id, action: action, final_reply: final_reply})});
  idx = 0;
  await load();
}

function skip() { idx = (idx + 1) % Math.max(queue.length, 1); render(null); }

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'a') send('accepted');
  if (e.key === 'e') send('edited');
  if (e.key === 'r') send('rejected');
});
load();
</script>
</body>
</html>
