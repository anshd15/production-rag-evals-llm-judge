name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Unit tests don't need torch / sentence-transformers (embeddings are imported lazily),
      # so CI installs the light dependencies only.
      - run: pip install pandas==3.0.5 numpy==2.5.3 scikit-learn==1.9.1 pyarrow==25.0.1 python-dotenv==1.2.3 pytest==9.1.1 qdrant-client==1.16.1
      - run: python -m pytest -q
      - name: Committed results are internally consistent
        run: python -m src.check_results
      - name: Guardrails hold against the adversarial corpus
        run: python -m src.redteam
      - name: Evaluation set matches its manifest
        run: python -m src.dataset verify
      - name: Quality gate on the committed run
        run: python -m src.gate
